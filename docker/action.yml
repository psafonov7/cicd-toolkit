name: Docker build
description: Build and push Docker image
inputs:
  container_name:
    description: "Container name (defaults to repo name)"
    default: ${{ github.repository }}
  build_number:
    description: "Build number for tagging the image"
    required: true
  path:
    description: "Path to folder with Dockerfile"
    default: "."
  push:
    description: "Whether to push the image to registry"
    default: 'false'
  registry_url:
    description: "Docker registry URL"
    default: docker.io
  registry_username:
    description: "Username for Docker registry"
  registry_token:
    description: "Token for Docker registry"
runs:
  using: "composite"
  steps:
    - name: Build image
      run: docker build ${{ inputs.path }} -t ${{ inputs.container_name }}:${{ inputs.build_number }}
      shell: sh

    - name: Tag image
      if: ${{ inputs.registry_url != '' }}
      run: |
        docker tag ${{ inputs.container_name }}:${{ inputs.build_number }} ${{ inputs.registry_url }}/${{ inputs.container_name }}:${{ inputs.build_number }}
      shell: sh

    - name: Login to Docker registry
      if: ${{ inputs.push == 'true' }}
      run: echo "${{ inputs.registry_token }}" | docker login ${{ inputs.registry_url }} -u ${{ inputs.registry_username }} --password-stdin
      shell: sh

    - name: Push image to registry
      if: ${{ inputs.push == 'true' }}
      run: docker push ${{ inputs.registry_url }}/${{ inputs.container_name }}:${{ inputs.build_number }}
      shell: sh
