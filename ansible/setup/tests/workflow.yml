on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: ./python/setup

      - name: Setup Ansible
        id: ansible-setup
        uses: ./ansible/setup
        env:
          INSTALL_TYPE: pip

      - name: Check installation
        run: ansible --version
